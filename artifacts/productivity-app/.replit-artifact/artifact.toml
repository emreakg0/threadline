kind = "web"
previewPath = "/"
title = "Productivity App"
description = "Minimal React, TypeScript, Vite and Tailwind starter with an Express backend. Placeholder homepage only, intended for manual development."
version = "1.0.0"
id = "artifacts/productivity-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21644

[services.development]
run = "pnpm --filter @workspace/productivity-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/productivity-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/productivity-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21644"
BASE_PATH = "/"
